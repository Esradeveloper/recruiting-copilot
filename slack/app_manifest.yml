# Slack app manifest for the Recruiting Copilot.
# api.slack.com/apps -> Create New App -> From a manifest -> paste this.
# Replace YOUR-PUBLIC-URL with the tunnel URL (local) or the Cloud Run URL (Day 6).
display_information:
  name: Recruiting Copilot
  description: AI pre-screening of applications. Humans decide.
features:
  bot_user:
    display_name: Recruiting Copilot
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
settings:
  interactivity:
    is_enabled: true
    request_url: https://YOUR-PUBLIC-URL/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
