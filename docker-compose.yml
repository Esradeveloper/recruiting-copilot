services:
  db:
    image: pgvector/pgvector:pg16
    container_name: recruiting-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on first start (empty volume), in alphabetical order.
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    image: ghcr.io/n8n-io/n8n:1.121.0
    container_name: recruiting-n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      GENERIC_TIMEZONE: Europe/Berlin
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Lets workflows read the variables below via $env (no secrets in workflow JSON).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Local API by default; set COPILOT_API_URL in .env to use the Cloud Run URL.
      COPILOT_API_URL: ${COPILOT_API_URL:-http://host.docker.internal:8000}
      COPILOT_API_KEY: ${COPILOT_API_KEY}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n:/workflows:ro

volumes:
  pgdata:
  n8ndata:
